<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Форма редактирования студента</title>
</head>
<body>
<div class="container mt-4 w-50 p-3 border border border-dark" style="background-color: #eee;">
    <form id="idForm" method="post">
        <h2 class="text-center">Редактирование предмета</h2>
    <div class="mb-3">
        <label for="name" class="form-label">Предмет:</label>
        <input type="text" id="subjectsEdit" name="Name_subjects" class="form-control" required>
    </div>
    <div class="text-center">
        <button type="submit" class="btn btn-warning">Изменить</button>
        <a href="/Frontend/views_list_subjects.html" class="btn btn-primary">Назад</a>        
    </div>
    </form>
<script>
//Встпавляет в input - название предмета
async function editSubjects(){
    const Url = new URLSearchParams(window.location.search);
    const id = Url.get('id');

    let response = await fetch(`http://studentsprojectrestfullapi/subjects/${id}`);
    let editS = await response.json();
    // console.log(editS);

document.getElementById('subjectsEdit').value = editS.Name_subjects;

//Изменение 
document.querySelector('#idForm').addEventListener('submit', async(event) => {
    event.preventDefault();

const Data = new FormData(event.target);
const json = Object.fromEntries(Data.entries());

let response = await fetch(`http://studentsprojectrestfullapi/subjects/${id}`, {
    method: 'PATCH',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify(json)
})
alert("Успешно обновлён")

    setTimeout(() => {
        window.location.href = `/Frontend/views_list_subjects.html`;
    }, 1000);
});
}
editSubjects()
</script>
</body>
</html>
