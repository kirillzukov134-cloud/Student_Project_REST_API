<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Добавление предмета</title>
</head>
<body>
    <div class="container mt-4 w-50 p-3 border border border-dark" style="background-color: #eee;">
        <form id="idFormAdd" method="post">
            <h2 class="text-center">Добавление предмета</h2>
                <div class="mb-3">
                    <label for="name" class="form-label">Название предмета</label>
                    <input type="text" id="Name_Subjects" name="Name_Subjects" class="form-control" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success">Добавить</button>
                    <button type="reset" class="btn btn-secondary">Сбросить</button>
                    <a href="/Frontend/Views/views_list_subjects.html" class="btn btn-primary"> Назад</a>
                </div>
        </form>
    </div>
<script>
    //Добавление студента
async function Addition(student) {
    student.preventDefault();

    const Data = new FormData();
Data.append('Name_Subjects', document.getElementById('Name_Subjects').value);

await fetch('http://studentsprojectrestfullapi/subjects/', {
    method: 'POST',
    body: Data
});

document.getElementById('idFormAdd').reset();
//Переадресация на главную страницу
setTimeout(() => {
    window.location.href = '/Frontend/Views/views_list_subjects.html';
}, 1000)

}
document.getElementById('idFormAdd').onsubmit = Addition;
</script>
</body>
</html>
