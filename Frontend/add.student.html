<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Добавление студентов</title>
</head>
<body>
<div class="col-md-6 container mt-4 w-50 p-3 border border border-dark" style="background-color: #eee;">
    <form method="post" id="StudentAdd">
        <h2 class="text-center">Добавление студентов</h2>
            <legend>Персональные данные</legend>
            <div class="mb-3">
                <label for="name" class="form-label">Имя:</label>
                <input type="text" name="Name_student" class="form-control" id="Name_student" required>
            </div>
            <div class="mb-3">
                <label for="surname" class="form-label">Фамилия:</label>
                <input type="text" name="Surname_student" id="Surname_student" class="form-control">
            </div>
            <div class="mb-3">
                <label for="group" class="form-label">Группа (ID):</label>
                <input type="number" name="group_id" id="group_id" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="birth" class="form-label">Дата рождения:</label>
                <input type="date" name="birth_date" id="birth_date" class="form-control" required>
            </div>
                <legend>Контакты</legend>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:*</label>
                    <input type="email" name="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон:*</label>
                    <input type="tel" name="phone" id="phone" class="form-control" required>
                </div>
        <button type="submit" class="btn btn-success">Добавить</button>
        <button type="reset" class="btn btn-secondary">Сбросить</button>
        <a href="/index.html" class="btn btn-primary">Назад</a>
    </form>
</div>
<script>
    //Добавление студента
async function Addition(student) {
    student.preventDefault();

    const Data = new FormData();
Data.append('Name_student', document.getElementById('Name_student').value);
Data.append('Surname_student', document.getElementById('Surname_student').value);
Data.append('group_id', document.getElementById('group_id').value);
Data.appned('birth_date', document.getElementById('birth_date').value);
Data.appned('email', document.getElementById('email').value);
Data.appned('phone', document.getElementById('phone').value);

await fetch('http://studentsprojectrestfullapi/students/', {
    method: 'POST',
    body: Data
});

document.getElementById('StudentAdd').reset();
await selectCard();
}
document.getElementById('StudentAdd').onsubmit = Addition;
selectCard();
</script>
</body>
</html>
