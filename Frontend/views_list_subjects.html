<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Список всех предметов</title>
</head>
<body>
    <div>
        <div class="col-md-5 container mt-4 w-50 p-3 border border border-dark" style="background-color: #eee;">
            <div class="text-center">
                <legend><b>Список предметов</b></legend>
                <table class="table table-bordered table-striped" style="border: 2px;">
                    <thead class="table-dark">
                        <tr>
                            <th>ID предмета</th>
                            <th>Предметы</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tableSubjects">
                        
                    </tbody>
                </table>
                    <a href="/Frontend/Adds/add.subjects.html" class="btn btn-success">Добавить предмет</a>
                    <a href="/Frontend/index.html" class="btn btn-primary">Назад</a>
            </div>
        </div>
    </div>
<script>
//Выводить все предметы
async function allSubjects(){
    let response = await fetch('http://studentsprojectrestfullapi/subjects/');
    let subjects = await response.json();

const container = document.getElementById('tableSubjects');
container.innerHTML = '';

subjects.forEach(subject => {
    container.innerHTML +=
    `
    <tr>
        <th>${subject.id}</th>
        <th>${subject.Name_subjects}</th>
        <th>
            <button onclick="deleteSubject(${subject.id})"class="btn btn-danger">Удалить</button>
            <a href="/Frontend/edit.subjects.html?id=${subject.id}" class="btn btn-warning">Изменить</a>
        </th>
    </tr>
    ` 
})
}
//Удаление предмета
async function deleteSubject(id) {
    const response = await fetch(`http://studentsprojectrestfullapi/subjects/${id}`, {
        method: 'DELETE',
    });
location.reload();
}
allSubjects();
</script>
</body>
</html>
