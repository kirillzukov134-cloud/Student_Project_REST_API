<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Список всех студентов</title>
</head>
<body>
    <div class="container">
        <div class="col-md-6 container mt-4 w-50 p-3 border border border-dark" style="background-color: #eee;">
            <div class="text-center">
                <h2>Список всех студентов</h2>
                <table class="table table-bordered table-striped", style="border: 5px;">
                    <thead class="table-dark">
                        <tr>
                            <th>Группа</th>
                            <th>Имя_студента</th>
                            <th>Фамилия_студента</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTable">
                        
                    </tbody>
                </table>
                    <a href="/Frontend/index.html" class="btn btn-primary">Назад</a>
            </div>
        </div>
    </div>
<script>
async function allStudents(){
    let response = await fetch('http://studentsprojectrestfullapi/students-table/');
    let students = await response.json();

    const container = document.getElementById('studentsTable');
    container.innerHTML = '';

    students.forEach(student => {
        container.innerHTML +=
        `
        <tr>
            <td>${student.group_name}</td>
            <td>${student.first_name}</td>
            <td>${student.last_name}</td>
        </tr>
        `;
    });
}
allStudents();
</script>
</body>
</html>
