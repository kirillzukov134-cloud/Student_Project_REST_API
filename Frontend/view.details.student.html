<script>
async function detailsStudent() {
    const Url = new URLSearchParams(window.location.search);
    const id = Url.get('id');

    let response = await fetch(`http://studentsprojectrestfullapi/students/${id}`)
    let details = await response.json();

    document.getElementById('idDiv').innerText = `${details.first_name} ${details.last_name}`;
    document.getElementById('group').innerText = `${details.group_name}`;
    document.getElementById('phone').innerText = `${details.phone}`;
    document.getElementById('email').innerText = `${details.email}`;
    document.getElementById('birth_date').innerText = `${details.birth_date}`;
}
