<!-- Контейнер для карточек -->
<div class="container">
    <div class="row card_body"></div>
</div>

<script>

//Карточки студентов
async function selectCard() {
    let response = await fetch('http://studentsprojectrestfullapi/students/');
    let students = await response.json();

    let container = document.querySelector('.card_body');
    container.innerHTML = '';

    students.forEach(student => {
        container.innerHTML += 
        `
            <div class="col-md-4 mb-3 d-flex justify-content-center">
                <div class="card" style="width: 15rem;">
                    <div class="card-body">
                        <h5 class="card-title">${student.Name_student} ${student.Surname_student}</h5>
                        <p class="card-text">Группа: ${student.group_id}</p>
                            <a href="/Frontend/view.details.student.html?id=${student.id}" class="btn btn-primary">Подробнее</a>
                            <a href="/Frontend/view.grades.student.html?id=${student.id}" class="btn btn-primary">Оценки</a>
                    </div>
                </div>
            </div>
        `;
    });
}

selectCard();
</script>
